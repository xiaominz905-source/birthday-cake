name: V12.3 browser visual checks

on:
  push:
    branches:
      - fix/v12.3-geometry
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/visual-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser checks
        run: |
          mkdir -p artifacts
          cat > browser-check.cjs <<'EOF'
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          const root = process.cwd();
          const mime = {
            '.html': 'text/html; charset=utf-8',
            '.js': 'text/javascript; charset=utf-8',
            '.css': 'text/css; charset=utf-8',
            '.png': 'image/png',
            '.jpg': 'image/jpeg',
            '.svg': 'image/svg+xml'
          };

          const server = http.createServer((req, res) => {
            const pathname = decodeURIComponent(new URL(req.url, 'http://127.0.0.1').pathname);
            const relative = pathname === '/' ? 'index.html' : pathname.replace(/^\\/+/, '');
            const file = path.resolve(root, relative);
            if (!file.startsWith(root + path.sep) && file !== path.join(root, 'index.html')) {
              res.writeHead(403); res.end('Forbidden'); return;
            }
            fs.readFile(file, (err, data) => {
              if (err) { res.writeHead(404); res.end('Not found'); return; }
              res.writeHead(200, { 'Content-Type': mime[path.extname(file)] || 'application/octet-stream' });
              res.end(data);
            });
          });

          (async () => {
            let browser;
            await new Promise(resolve => server.listen(4173, '127.0.0.1', resolve));
            try {
              browser = await chromium.launch({
                headless: true,
                args: [
                  '--no-sandbox',
                  '--enable-webgl',
                  '--use-gl=angle',
                  '--use-angle=swiftshader',
                  '--enable-unsafe-swiftshader'
                ]
              });

              const runViewport = async (name, viewport, mobile) => {
                const page = await browser.newPage({ viewport, deviceScaleFactor: 1, isMobile: mobile, hasTouch: mobile });
                const pageErrors = [];
                const consoleErrors = [];
                const failedRequests = [];
                page.on('pageerror', error => pageErrors.push(String(error)));
                page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
                page.on('requestfailed', request => failedRequests.push({ url: request.url(), error: request.failure()?.errorText || 'failed' }));

                await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
                try {
                  await page.waitForFunction(() => window.__cakeV12Ready === true, { timeout: 60000 });
                } catch (error) {
                  const state = await page.evaluate(() => ({
                    loading: document.querySelector('#loading')?.innerText || null,
                    error: document.querySelector('#error')?.innerText || null,
                    errorDisplay: getComputedStyle(document.querySelector('#error')).display,
                    diagnostics: window.__cakeV12Diagnostics || null
                  }));
                  throw new Error(name + ' render timeout: ' + JSON.stringify(state) + '; pageErrors=' + JSON.stringify(pageErrors) + '; consoleErrors=' + JSON.stringify(consoleErrors) + '; failedRequests=' + JSON.stringify(failedRequests));
                }

                await page.waitForTimeout(1200);
                const diagnostics = await page.evaluate(() => window.__cakeV12Diagnostics);
                if (!diagnostics || diagnostics.three !== '161' || !diagnostics.webgl) {
                  throw new Error(name + ' diagnostics invalid: ' + JSON.stringify(diagnostics));
                }

                await page.screenshot({ path: 'artifacts/' + name + '.png', fullPage: true });
                await page.locator('#blow').click();
                const wishToast = await page.locator('#toast').evaluate(el => el.classList.contains('show'));
                if (!wishToast) throw new Error(name + ' blow-candle button did not show the wish toast');
                await page.locator('#relight').click();
                await page.locator('#pause').click();
                await page.locator('#reset').click();

                const result = { name, diagnostics, pageErrors, consoleErrors, failedRequests, wishToast };
                await page.close();
                return result;
              };

              const desktop = await runViewport('desktop', { width: 1440, height: 900 }, false);
              const mobile = await runViewport('mobile', { width: 390, height: 844 }, true);
              console.log('BROWSER_CHECK_RESULT=' + JSON.stringify({ desktop, mobile }));

              if (desktop.pageErrors.length || mobile.pageErrors.length) {
                throw new Error('Uncaught page errors detected');
              }
              if (desktop.consoleErrors.length || mobile.consoleErrors.length) {
                throw new Error('Console errors detected');
              }
            } finally {
              if (browser) await browser.close();
              server.close();
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          EOF
          node browser-check.cjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12.3-browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
